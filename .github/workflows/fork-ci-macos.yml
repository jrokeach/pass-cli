# Fork-only workflow: the macOS binary, built apart from Fork CI so that a shortage of macOS
# runners never holds up an upstream sync or a release. On a release it adds the binary to the
# release Fork CI publishes once its checks and Linux build pass, waiting for that release.
name: Fork CI (macOS)
on:
  push:
    branches:
      - "fork/**"
    tags:
      - "v*-mailbox.*"
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (startsWith(github.ref_name, 'fork/release-v') && github.ref_name || '') }}
jobs:
  build:
    uses: ./.github/workflows/fork-build.yml
    with:
      os: macos-latest
      target: aarch64-apple-darwin

  release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref_name, 'fork/release-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG#fork/release-}"
          # Fork CI publishes the release; it never does if its checks fail.
          for _ in $(seq 120); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$tag" >/dev/null
          cd dist
          gh release download "$tag" --pattern SHA256SUMS --clobber || touch SHA256SUMS
          cat SHA256SUMS *.sha256 | sort -u -k2 > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" ./* --clobber
