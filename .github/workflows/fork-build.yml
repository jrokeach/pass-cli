# Fork-only reusable workflow: builds and packages the pass-cli binary for one target.
# Called by Fork CI (Linux) and Fork CI (macOS).
name: Fork build
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      target:
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (startsWith(github.ref_name, 'fork/release-v') && github.ref_name || '') }}
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.target }}
      # The published Cargo.lock lists workspace members missing from the public source, so it
      # cannot be used with --locked; cargo only prunes those entries.
      - run: cargo build --release -p pass-cli --target ${{ inputs.target }}
      - name: Package
        shell: bash
        run: |
          version="${RELEASE_TAG#fork/release-}"
          version="${version:-${GITHUB_SHA::7}}"
          name="pass-cli-fork-$version-${{ inputs.target }}"
          mkdir dist
          cp "target/${{ inputs.target }}/release/pass-cli" "dist/$name"
          cd dist
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          "./$name" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}
          path: dist/*
