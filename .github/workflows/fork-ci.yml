# Fork-only workflow: checks, tests and release binaries for the alias-mailboxes fork.
name: Fork CI
on:
  push:
    branches:
      - "fork/**"
    tags:
      - "v*-mailbox.*"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (changed modules)
        run: |
          rustfmt --edition 2024 --check \
            pass/src/item/alias/mod.rs \
            pass-cli/src/commands/item/alias/mod.rs \
            pass-cli/src/commands/item/view.rs
      - name: cargo fmt --all --check (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy -p pass -p pass-cli --all-targets -- -D warnings
      - name: cargo test (pass)
        run: cargo test -p pass
      - name: cargo test (pass-cli)
        run: cargo test -p pass-cli

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p pass-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="pass-cli-fork-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/pass-cli" "dist/$name"
          cd dist
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          "./$name" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
          body: |
            Unofficial fork build of pass-cli 2.5.1 with alias mailbox support
            (`item alias create --mailbox`, `item alias update`, mailboxes in `item view`).
            Not affiliated with or supported by Proton. Install under a separate name
            (e.g. `pass-cli-fork`) and set `PROTON_PASS_NO_UPDATE_CHECK=1`; see FORK.md.
